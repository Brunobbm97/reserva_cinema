spring.application.name=reserva-cinema

# Conexão com o PostgreSQL (valores padrão para desenvolvimento local;
# podem ser sobrescritos pelas variáveis de ambiente DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reserva_cinema}
spring.datasource.username=${DB_USER:cinema}
spring.datasource.password=${DB_PASSWORD:cinema}

# O Flyway cria as tabelas. O Hibernate só confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Segurança / JWT ----------
# Chave secreta usada para assinar os tokens (Base64, mínimo 256 bits).
# O valor padrão serve APENAS para desenvolvimento. Em produção, defina JWT_SECRET.
app.jwt.secret=${JWT_SECRET:ZGV2LXNvbWVudGUtdHJvcXVlLWVzdGEtY2hhdmUtZW0tcHJvZHVjYW8tMTIzNDU2Nzg5MA==}
# Access token: curto, vai em toda requisição.
app.jwt.access-token-minutes=15
# Refresh token: longo, só serve para pedir um novo access token.
app.jwt.refresh-token-days=7

# ---------- Admin inicial (seed) ----------
# Criado na primeira vez que a aplicação sobe, se ainda não existir.
app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@cinema.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---------- Upload de pôster ----------
# Pasta local onde os arquivos de pôster são gravados (criada se não existir).
app.storage.poster-dir=${POSTER_DIR:uploads/posters}
# Limite de tamanho de cada upload.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
